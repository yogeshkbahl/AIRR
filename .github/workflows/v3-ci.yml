name: v3-ci

# Root-level copy of V3/ai-bi-analyst/ai-bi-analyst/.github/workflows/ci.yml.
# GitHub only runs workflows from the repository root, so this version points
# every job at the V3 app folder and only triggers when V3 changes.

on:
  push:
    branches: [main]
    paths: ["V3/**", ".github/workflows/v3-ci.yml"]
  pull_request:
    paths: ["V3/**", ".github/workflows/v3-ci.yml"]
  workflow_dispatch:
  schedule:
    # Advisories appear without anyone touching the code, so the audit jobs run
    # weekly against the pinned dependency set as well as on every change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  APP_DIR: V3/ai-bi-analyst/ai-bi-analyst

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V3/ai-bi-analyst/ai-bi-analyst/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: V3/ai-bi-analyst/ai-bi-analyst/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint, including the bandit security ruleset
        run: ruff check app tests
      - name: Formatting
        run: ruff format --check app tests
      - name: Tests
        run: pytest -q
      - name: Dependency audit
        # Fails on any known advisory in the pinned runtime set.
        run: pip-audit -r requirements.txt --strict --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V3/ai-bi-analyst/ai-bi-analyst/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: V3/ai-bi-analyst/ai-bi-analyst/frontend/package-lock.json
      - name: Install from the lockfile only
        run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Dependency audit
        # Moderate and above fails the build. Runtime-only view first, then the
        # full tree so a dev-tool advisory is visible without blocking a release.
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=moderate

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -t ai-bi-analyst-backend:ci ./${{ env.APP_DIR }}/backend
      - name: Scan the image for OS and library CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ai-bi-analyst-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    # CodeQL on private repositories needs GitHub Advanced Security, so this
    # job only runs once the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
