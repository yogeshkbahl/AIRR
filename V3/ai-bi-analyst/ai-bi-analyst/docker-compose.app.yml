# Run the analyst as a self-contained app on any machine with Docker:
#   start-app.bat (Windows) or ./start-app.sh (macOS/Linux)
# or directly:
#   docker compose -f docker-compose.app.yml up -d --build
# then open http://localhost:8080 (APP_PORT in .env changes the port).
#
# docker-compose.yml is the development setup (hot reload, source mounts);
# this file bakes the code into the images and serves a production build.
name: ai-bi-analyst

services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      WORKSPACE_DIR: /data/workspace
      METADATA_DB: /data/metadata.sqlite
      QUERY_LOG_DIR: /logs/queries
      # Log file names and folders use this zone; start-app sets it from the host.
      TZ: ${TZ:-UTC}
      # nginx serves the app and the API from one origin.
      CORS_ORIGINS: http://localhost:${APP_PORT:-8080},http://127.0.0.1:${APP_PORT:-8080}
    volumes:
      - analyst-data:/data
      # Debug logs land on the host so they can be opened directly.
      - ./logs:/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  analyst-data:
