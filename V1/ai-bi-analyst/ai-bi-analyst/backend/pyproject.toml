[project]
name = "ai-bi-analyst-backend"
version = "1.0.0"
description = "Governed EDA and BI recommendation service: Python computes, the model interprets."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "SIM108"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
