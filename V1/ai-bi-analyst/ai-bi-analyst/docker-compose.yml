services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:5173
      WORKSPACE_DIR: /data/workspace
      METADATA_DB: /data/metadata.sqlite
    volumes:
      - workspace:/data
      - ./backend/app:/app/app          # hot reload while you customise
      - ./backend/samples:/app/samples
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "5173:5173"

volumes:
  workspace:
